<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Sillage PH</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="session.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body >
<header class="site-header wrap">
  <a class="wordmark" href="index.html">sillage<span> / PH</span></a>
  <nav aria-label="Main navigation">
    <a href="index.html#collection">Catalog</a><a href="quiz.html">Scent quiz</a>
    <a href="compare.html">Compare</a>
    <a href="login.html">Account</a>
  </nav>
</header>
<main class="wrap">
<section class="auth-panel">
  <h1>Welcome back.</h1>
  <p>Sign in to save perfumes and revisit your favorites.</p>
  <form id="loginForm" class="auth-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <button type="submit" class="btn">Sign in</button>
  </form>
  <p><button class="btn secondary" id="authMode" type="button">New here? Create an account</button></p>
  <p id="authMessage" role="status"></p>
</section>
</main>
</body>
</html>
