<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard | Sillage PH</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="session.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body data-page="admin">
<header class="site-header wrap">
  <a class="wordmark" href="index.html">sillage<span> / PH</span></a>
  <nav aria-label="Main navigation">
    <a href="index.html#collection">Catalog</a><a href="quiz.html">Scent quiz</a>
    <a href="compare.html">Compare</a><a href="schema.html">Database schema</a>
    <a href="login.html">Account</a>
  </nav>
</header>
<main class="wrap">
<section class="auth-panel">
  <h1>Admin dashboard</h1>
  <p id="dashboardMessage" role="status">Checking your session...</p>
  <a id="signInLink" href="login.html" hidden>Sign in</a>
  <section id="dashboard" hidden>
    <p id="identity"></p>
    <div class="auth-actions">
      <a href="account.html" id="favoritesLink" >My favorites</a>
      <a href="admin.html" id="adminLink" hidden>Admin dashboard</a>
      <button class="btn secondary" id="logout" type="button">Sign out</button>
    </div>
    <h2>Manage perfumes</h2>
    <form id="perfumeEditor" class="auth-form">
      <label for="perfumeSelect">Perfume record</label>
      <select id="perfumeSelect"><option value="">New perfume</option></select>
      <label for="perfumeJson">Perfume fields (JSON)</label>
      <textarea id="perfumeJson" rows="16" required spellcheck="false"></textarea>
      <div class="auth-actions">
        <button class="btn" type="submit">Save perfume</button>
        <button class="btn secondary" id="deletePerfume" type="button" disabled>Delete perfume</button>
      </div>
    </form>
  </section>
</section>
</main>
</body>
</html>
